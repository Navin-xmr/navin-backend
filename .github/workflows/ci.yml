name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      redis: ${{ steps.filter.outputs.redis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check path filters
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
            # Redis durability surface: the compose redis service, the AOF/volume
            # config, and the persistence probe itself (#637).
            redis:
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'scripts/redis-persistence-probe.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  verify:
    name: Deps audit · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Check for undeclared dependencies
        run: npm run check:deps

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run OpenAPI Lint
        run: npm run lint:openapi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: changes
    # Always verify the image on main pushes; path-filter only on PRs
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false # verification-only build; re-enable when publishing to a registry
          tags: navin-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: changes
    # Run on main pushes and when docker-related files change on PRs
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Validate compose files
        run: docker compose -f docker-compose.yml config -q

      - name: Bring up stack (production profile, no override)
        run: |
          docker compose -p smoke-positive -f docker-compose.yml up -d --build
          echo "Stack started; waiting for API health..."

      - name: Wait for /api/health to return 200
        # Polls every 2 s for up to 60 s (30 attempts). Exits nonzero on timeout.
        run: |
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (200) after $((i*2)) seconds"
              exit 0
            fi
            echo "Attempt $i: status=${STATUS:-no-response}"
            sleep 2
          done
          echo "API failed to become healthy within 60 seconds (last status: ${STATUS:-unknown})"
          exit 1

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -p smoke-positive -f docker-compose.yml ps
          echo "=== app logs ==="
          docker compose -p smoke-positive -f docker-compose.yml logs app || true
          echo "=== stellar-worker logs ==="
          docker compose -p smoke-positive -f docker-compose.yml logs stellar-worker || true
          echo "=== stellar-indexer logs ==="
          docker compose -p smoke-positive -f docker-compose.yml logs stellar-indexer || true
          echo "=== mongo logs ==="
          docker compose -p smoke-positive -f docker-compose.yml logs mongo || true
          echo "=== redis logs ==="
          docker compose -p smoke-positive -f docker-compose.yml logs redis || true

      - name: Tear down
        if: always()
        run: docker compose -p smoke-positive -f docker-compose.yml down -v --remove-orphans

  compose-smoke-negative:
    name: Docker Compose smoke test (invalid config)
    runs-on: ubuntu-latest
    needs: [changes, compose-smoke]
    # Requires compose-smoke to pass first (gate must reliably fail on timeout)
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Bring up stack with deliberately invalid JWT_SECRET
        # A 10-character secret is below the 32-character minimum enforced by
        # src/env.ts; the API should crash or refuse to become healthy.
        run: |
          JWT_SECRET=tooshort10 docker compose -p smoke-negative \
            -f docker-compose.yml up -d --build
          echo "Stack started; verifying API does NOT become healthy..."

      - name: Assert API does not become healthy
        # The gate must return nonzero when the API never serves 200.
        # We intentionally wait the full 60 s before asserting.
        run: |
          STATUS=""
          HEALTHY=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" = "true" ]; then
            echo "FAIL: API became healthy with an invalid JWT_SECRET (status 200). The negative-path check detected a regression."
            exit 1
          fi
          echo "PASS: API did not become healthy with an invalid JWT_SECRET (last status: ${STATUS:-no-response})"
          exit 0

      - name: Debug (expected failure diagnostics)
        if: always()
        run: |
          echo "=== docker compose ps ==="
          docker compose -p smoke-negative -f docker-compose.yml ps || true
          echo "=== app logs (expected crash) ==="
          docker compose -p smoke-negative -f docker-compose.yml logs app || true

      - name: Tear down
        if: always()
        run: docker compose -p smoke-negative -f docker-compose.yml down -v --remove-orphans

  # #637 - proves the H2.4 durability decision actually holds: a real BullMQ
  # job must survive a restart of *only* the redis container, with its volume
  # left intact, and must still be processable afterwards.
  #
  # Only the `redis` service is started. Bringing up the whole stack would let
  # `stellar-worker` consume the probe job before the restart, leaving nothing
  # to assert. The dedicated project name (`redis-persistence`) keeps the probe
  # on its own volume, so a developer's local stack is never touched.
  redis-persistence:
    name: Redis queue persistence across restart
    runs-on: ubuntu-latest
    needs: changes
    # Always verify on main pushes; on PRs only when the persistence config moves.
    if: github.event_name == 'push' || needs.changes.outputs.redis == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Clean install dependencies
        run: npm ci

      - name: Assert the durability config is declared in compose
        # Cheap static gate: fails fast and points at the exact line if the AOF
        # flag or the named volume is dropped from docker-compose.yml.
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/compose.json
          node -e '
            const fs = require("fs");
            const compose = JSON.parse(fs.readFileSync("/tmp/compose.json", "utf8"));
            const redis = compose.services.redis;
            const problems = [];
            if (!redis) problems.push("no `redis` service in docker-compose.yml");
            else {
              const cmd = JSON.stringify(redis.command ?? "");
              if (!cmd.includes("--appendonly") || !cmd.includes("yes")) {
                problems.push("redis command does not enable AOF: " + cmd);
              }
              const mounts = (redis.volumes ?? []).map((v) =>
                typeof v === "string" ? v : v.source + ":" + v.target
              );
              if (!mounts.some((m) => m.includes("redis_data") && m.includes("/data"))) {
                problems.push("redis is not backed by the named redis_data volume on /data: " + JSON.stringify(mounts));
              }
            }
            if (!compose.volumes || !compose.volumes.redis_data) {
              problems.push("top-level `redis_data` volume is not declared");
            }
            if (problems.length) {
              console.error("FAIL: Redis durability config regressed:");
              for (const p of problems) console.error("  - " + p);
              process.exit(1);
            }
            console.log("PASS: redis runs with AOF and the named redis_data volume");
          '

      - name: Start redis only
        run: docker compose -p redis-persistence -f docker-compose.yml up -d redis

      - name: Wait for redis
        run: |
          for i in $(seq 1 30); do
            if docker compose -p redis-persistence -f docker-compose.yml exec -T \
                redis redis-cli ping | grep -q PONG; then
              echo "redis is up after $((i)) attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: redis did not answer PING"
          exit 1

      - name: Enqueue a real BullMQ job
        run: node scripts/redis-persistence-probe.mjs enqueue

      - name: Restart only the redis container (volume preserved)
        # `restart`, never `down -v`: removing the volume is exactly the
        # scenario this check exists to distinguish from a plain restart.
        run: |
          docker compose -p redis-persistence -f docker-compose.yml restart redis
          for i in $(seq 1 30); do
            if docker compose -p redis-persistence -f docker-compose.yml exec -T \
                redis redis-cli ping | grep -q PONG; then
              echo "redis restarted and healthy again (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: redis did not come back after restart"
          exit 1

      - name: Assert the job survived and is still processable
        run: node scripts/redis-persistence-probe.mjs verify

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -p redis-persistence -f docker-compose.yml ps
          echo "=== redis logs ==="
          docker compose -p redis-persistence -f docker-compose.yml logs redis || true
          echo "=== appendonly / dataset ==="
          docker compose -p redis-persistence -f docker-compose.yml exec -T \
            redis redis-cli config get appendonly || true
          docker compose -p redis-persistence -f docker-compose.yml exec -T \
            redis redis-cli dbsize || true
          echo "=== bullmq keys ==="
          docker compose -p redis-persistence -f docker-compose.yml exec -T \
            redis redis-cli keys 'bull:transaction_queue:*' || true

      - name: Tear down (scoped to this project only)
        # `down -v` is scoped to the `redis-persistence` project, so only the
        # probe's own redis_data volume is removed - no unrelated volumes.
        if: always()
        run: docker compose -p redis-persistence -f docker-compose.yml down -v --remove-orphans
