  /api/events:
    get:
      summary: Real-time event stream (SSE)
      description: |
        Status: implemented (x-implemented: true). Listed in API-QA #398 for completeness.
        Opens a Server-Sent Events stream for the authenticated user. Events are scoped
        per user via Redis pub/sub channels and include shipment, settlement, anomaly,
        and location updates. A heartbeat comment is sent every 30 seconds.

        Authentication accepts either `Authorization: Bearer <token>` or `?token=<jwt>`
        for EventSource clients that cannot set custom headers.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: token
          required: false
          schema:
            type: string
          description: JWT for EventSource clients that cannot send Authorization headers
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of SSE messages. Event types: shipment:status, shipment:milestone,
                  settlement:status, notification:new, anomaly:detected, location:update.
              examples:
                shipmentStatus:
                  summary: Shipment status change
                  value: |
                    event: shipment:status
                    data: {"type":"shipment:status","shipmentId":"671000000000000000000001","newStatus":"IN_TRANSIT","timestamp":"2026-01-15T12:00:00.000Z"}
                heartbeat:
                  summary: Keep-alive heartbeat (every 30s)
                  value: |
                    : heartbeat
        '401':
          description: Missing, invalid, or revoked JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/api-keys:
    post:
      summary: Create a new API key
      description: Generates a new API key for machine-to-machine authentication. The raw API key is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - organizationId
              properties:
                name:
                  type: string
                  description: Descriptive name for the API key
                organizationId:
                  type: string
                  description: MongoDB ObjectId of the organization
                shipmentId:
                  type: string
                  description: Optional MongoDB ObjectId of a specific shipment
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apiKey:
                        type: string
                        description: Raw API key (shown only once)
                      id:
                        type: string
                      name:
                        type: string
                      organizationId:
                        type: string
                      shipmentId:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/sessions:
    get:
      summary: List active sessions
      description: |
        Returns all active session records for the authenticated user (one per device/login).
        Sessions are ordered newest-first.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sessions retrieved
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/sessions/{jti}:
    delete:
      summary: Revoke a session
      description: |
        Blocklists the token identified by `jti` in Redis and removes the session record.
        The token will be rejected immediately by `requireAuth` on subsequent requests.

        - Returns **403** if the session belongs to a different user (cross-user revocation).
        - Returns **404** if no session with that `jti` exists.
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jti
          required: true
          schema:
            type: string
          description: The JWT ID (`jti` claim) of the session to revoke
      responses:
        '200':
          description: Session revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session revoked successfully
                  data:
                    type: string
                    nullable: true
                    example: null
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — cannot revoke another user's session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/signup:
    post:
      summary: Register a new user
      security: []
      description: Creates a new user account. organizationId is optional. Public signup does not allow privileged role assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                name:
                  type: string
                  minLength: 1
                  description: User full name
                password:
                  type: string
                  minLength: 8
                  description: Password (minimum 8 characters)
                organizationId:
                  type: string
                  description: Optional organization ID to associate with user
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                      token:
                        type: string
                  meta:
                    type: object
        '400':
          description: Validation error (e.g., password too short, missing required fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: string
                    nullable: true
  /api/auth/register/company:
    post:
      summary: Self-service company registration
      description: |
        Creates both an Organization (type: ENTERPRISE) and its first admin user in a single atomic operation.
        
        This endpoint enables self-service company onboarding without requiring a SUPER_ADMIN to pre-provision organizations.
        It creates:
        1. An Organization with type ENTERPRISE and company settings (industry, country, company size)
        2. An admin user (role: ADMIN) linked to the new organization
        3. Returns a JWT token with organization context included
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
                - industry
                - country
                - companySize
                - adminName
                - email
                - password
              properties:
                companyName:
                  type: string
                  minLength: 1
                  description: Name of the company
                industry:
                  type: string
                  minLength: 1
                  description: Industry classification (e.g., Logistics, Tech, Healthcare)
                country:
                  type: string
                  minLength: 1
                  description: Country code or name
                companySize:
                  type: string
                  minLength: 1
                  description: Company size category (e.g., 10-50, 50-100, 100+, 500+)
                adminName:
                  type: string
                  minLength: 1
                  description: Full name of the first admin user
                email:
                  type: string
                  format: email
                  description: Email address for the admin user (must be unique)
                password:
                  type: string
                  minLength: 8
                  description: Admin password (minimum 8 characters)
      responses:
        '201':
          description: Company and admin user created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Admin user ID
                          email:
                            type: string
                            description: Admin user email
                          name:
                            type: string
                            description: Admin user name
                          role:
                            type: string
                            enum:
                              - ADMIN
                      token:
                        type: string
                        description: JWT bearer token with organization context
                  meta:
                    type: object
        '400':
          description: Validation error (missing fields, weak password, invalid email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - email already in use or company name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/invitations:
    post:
      summary: Create and send invitation
      description: Send an invitation to a new team member (requires ADMIN role).
      security:
        - bearerAuth: []
      tags:
        - Invitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to invite
                role:
                  type: string
                  enum:
                    - ADMIN
                    - MANAGER
                    - DRIVER
                    - VIEWER
                    - CUSTOMER
                  description: Role to assign to invitee
                message:
                  type: string
                  description: Optional custom message in invitation
      responses:
        '201':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Invitation ID
                      token:
                        type: string
                        description: Invitation token for frontend
                      email:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '409':
          description: Email already in use or invitation already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List organization invitations
      description: Get all invitations for the organization (requires ADMIN role).
      security:
        - bearerAuth: []
      tags:
        - Invitations
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination
        - in: query
          name: status
          schema:
            type: string
            enum:
              - PENDING
              - ACCEPTED
              - EXPIRED
