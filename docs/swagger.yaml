paths:
  /api/webhooks/iot:
    post:
      tags:
        - Webhooks
      summary: IoT webhook — ingest telemetry into the anchoring pipeline
      description: |
        Receives telemetry from IoT sensors/gateways and kicks off the async ingestion pipeline:

        1. **Normalize** — union payload → canonical fields (`normalizeIotWebhookBody`)
        2. **Persist** — MongoDB telemetry with `anchorStatus=PENDING_ANCHOR` and `dataHash`
        3. **Queue** — enqueue BullMQ job on `transaction_queue` (`anchor_telemetry`)
        4. **Emit socket** — `telemetry_update` to the shipment room
        5. **Detect anomaly** (async `setImmediate`) — thresholds default to **maxTemp=25°C / maxHumidity=80% / minBatteryLevel=20%**
           (operational defaults; not the legacy 85/90 hardcodes on `GET /api/telemetry/thresholds`)
        6. **Alert** — on detection, emit `anomaly_detected` and push to `alert_queue`

        Returns **202 Accepted** as soon as the record is stored and the anchor job is queued.
        Stellar anchoring is completed by `stellar.worker` consuming `transaction_queue`.

        See `docs/telemetry-pipeline.md` for the full sequence diagram.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IotWebhookBody'
            examples:
              normalizedShipmentPayload:
                summary: Shipment-centric (normalized) payload
                value:
                  shipmentId: '507f1f77bcf86cd799439011'
                  temperature: 22.5
                  humidity: 55
                  latitude: 12.34
                  longitude: 56.78
                  batteryLevel: 88
                  timestamp: '2026-01-15T12:30:00.000Z'
              sensorCentricPayload:
                summary: Sensor-centric payload (temp + location)
                value:
                  sensorId: 'SENSOR-42'
                  temp: 22.5
                  humidity: 55
                  location:
                    lat: 12.34
                    lng: 56.78
                  batteryLevel: 88
                  timestamp: '2026-01-15T12:30:00.000Z'
      responses:
        '202':
          description: >
            Telemetry accepted and queued for Stellar anchoring.
            Anomaly detection runs asynchronously after this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IotWebhookAcceptedResponse'
              example:
                success: true
                message: Telemetry received and queued for Stellar anchoring
                data:
                  _id: t1
                  shipmentId: '507f1f77bcf86cd799439011'
                  sensorId: 'SENSOR-42'
                  temperature: 22.5
                  humidity: 55
                  latitude: 12.34
                  longitude: 56.78
                  batteryLevel: 88
                  timestamp: '2026-01-15T12:30:00.000Z'
                  dataHash: 'a1b2c3...'
                  anchorStatus: PENDING_ANCHOR
        '400':
          description: Invalid request payload (Zod validation failure or unresolvable shipmentId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active shipment found for the given sensorId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/webhooks/stellar:
    post:
      tags:
        - Webhooks
      summary: Stellar proof-of-delivery / settlement webhook
      description: |
        Receives Stellar settlement callbacks for proof-of-delivery and escrow events
        (`release`, `escrow`, `failed`). This is the settlement side of the telemetry
        pipeline — distinct from BullMQ `transaction_queue` hash anchoring.

        Requires a valid HMAC-SHA256 signature in the `x-stellar-signature` header,
        computed over the raw request body using `STELLAR_WEBHOOK_SECRET`.

        On `release`, payment status becomes RELEASED and a `SETTLEMENT_COMPLETED`
        ledger block may be written. See `docs/telemetry-pipeline.md`.
      security:
        - stellarSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StellarWebhookPayload'
            example:
              id: evt_01HXYZ
              type: release
              paymentId: '507f1f77bcf86cd799439022'
              transactionHash: 'a1b2c3d4e5f6...'
              amount: 1500
              timestamp: '2026-01-15T13:00:00.000Z'
      responses:
        '200':
          description: Stellar webhook received and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StellarWebhookResponse'
        '400':
          description: Invalid Stellar webhook payload or unknown event type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid x-stellar-signature header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      summary: Health check
      description: Public health endpoint used by load balancers and uptime monitors.
      security: []
