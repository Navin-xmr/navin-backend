  /api/auth/2fa/setup:
    post:
      summary: Initiate TOTP 2FA setup
      description: |
        Generates a TOTP secret for the authenticated user and returns an `otpauth://` URI
        for QR-code rendering. 2FA is NOT yet active — the user must call
        `POST /api/auth/2fa/verify` with a valid code to enable it.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      otpauthUrl:
                        type: string
                        description: otpauth:// URI to encode as QR code
                      secret:
                        type: string
                        description: Raw TOTP secret for manual entry
        '401':
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/2fa/verify:
    post:
      summary: Verify first TOTP code and enable 2FA
      description: |
        Validates the first TOTP code after setup. On success, enables 2FA and returns
        10 single-use backup codes (plaintext, shown exactly once — store them safely).
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6-digit TOTP code from the authenticator app
      responses:
        '200':
          description: 2FA enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      backupCodes:
                        type: array
                        items:
                          type: string
                        description: 10 single-use backup codes (shown once only)
        '400':
          description: Invalid or wrong TOTP code, or setup not initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many verification attempts (rate-limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  retryAfter:
                    type: integer
                  data:
                    type: string
                    nullable: true
