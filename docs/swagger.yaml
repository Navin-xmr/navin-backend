                      hasMore:
                        type: boolean
                      page:
                        type: integer
  /api/telemetry/bulk:
    post:
      summary: Bulk ingest telemetry readings
      description: |
        Authenticated batch ingest of sensor readings (JWT). Batch size is 1–1000 items
        (`BulkTelemetryBodySchema`). Unlike `POST /api/webhooks/iot` (API key), this path
        requires Bearer auth and has no additional role gate beyond `requireAuth`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required:
                      - shipmentId
                      - temperature
                      - humidity
                      - latitude
                      - longitude
                      - batteryLevel
                      - timestamp
                    properties:
                      shipmentId:
                        type: string
                        minLength: 1
                      temperature:
                        type: number
                        minimum: -50
                        maximum: 100
                      humidity:
                        type: number
                      latitude:
                        type: number
                      longitude:
                        type: number
                      batteryLevel:
                        type: number
                        minimum: 0
                        maximum: 100
                      timestamp:
                        type: string
                        format: date-time
                      sensorId:
                        type: string
      responses:
        '201':
          description: Bulk telemetry ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Bulk telemetry ingested
                  data:
                    type: object
                    properties:
                      insertedCount:
                        type: integer
                      insertedIds:
                        type: array
                        items:
                          type: string
        '400':
          description: Validation error or bad request (`ERR_BAD_REQUEST` / `VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Related shipment/sensor not found (`ERR_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
