                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: active
                      uptime:
                        type: number
                        description: Process uptime in seconds
                      timestamp:
                        type: string
                        format: date-time
                        description: Current UTC timestamp

