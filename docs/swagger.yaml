                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        shipmentId:
                          type: string
                        sensorId:
                          type: string
                        temperature:
                          type: number
                        humidity:
                          type: number
                        latitude:
                          type: number
                        longitude:
                          type: number
                        batteryLevel:
                          type: number
                        timestamp:
                          type: string
                          format: date-time
                        dataHash:
                          type: string
                        stellarTxHash:
                          type: string
                        anchorStatus:
                          type: string
                        anchorError:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
