  /api/activity:
    get:
      summary: Get activity feed
      description: |
        Returns a paginated activity feed of platform-wide events ordered
        newest-first. Accessible to ADMIN, MANAGER, and VIEWER roles.

        **Pagination** uses the `before` parameter (ISO 8601 date-time string).
        Pass the `meta.before` value from the previous response as the next
        `before` to walk backwards through history.

        **Action types** currently emitted:
        `SHIPMENT_CREATED`, `SHIPMENT_STATUS_CHANGED`, `PROOF_UPLOADED`,
        `DISPUTE_OPENED`, `TELEMETRY_ANCHORED`, `SETTLEMENT_RELEASED`,
        `ANOMALY_DETECTED`, `USER_INVITED`, `RBAC_ROLE_MODIFIED`,
        `API_KEY_GENERATED`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before
          schema:
            type: string
            format: date-time
          description: >
            Return only events whose timestamp is strictly older than this
            ISO 8601 date-time. Omit to fetch the most recent events.
          example: '2026-06-01T12:00:00.000Z'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of events to return (1–100).
        - in: query
          name: userId
          schema:
            type: string
          description: Filter by the actor's user ID.
        - in: query
          name: action
          schema:
            type: string
            enum:
              - SHIPMENT_CREATED
              - SHIPMENT_STATUS_CHANGED
              - PROOF_UPLOADED
              - DISPUTE_OPENED
              - TELEMETRY_ANCHORED
              - SETTLEMENT_RELEASED
              - ANOMALY_DETECTED
              - USER_INVITED
              - RBAC_ROLE_MODIFIED
              - API_KEY_GENERATED
          description: Filter by action type.
        - in: query
          name: resource
          schema:
            type: string
            enum:
              - SHIPMENT
              - TELEMETRY
              - PAYMENT
              - ANOMALY
              - USER
              - API_KEY
          description: Filter by resource category.
      responses:
        '200':
          description: Activity feed retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                  - meta
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Activity retrieved
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEvent'
                  meta:
                    type: object
                    required:
                      - limit
                      - total
                      - hasMore
                      - before
                    properties:
                      limit:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        description: Total matching events (unfiltered by before).
                        example: 142
                      hasMore:
                        type: boolean
                        description: Whether older events exist beyond this page.
                        example: true
                      before:
                        type: string
                        format: date-time
                        nullable: true
                        description: >
                          Pass this value as the `before` query parameter to
                          fetch the next page. Null when no more pages exist.
                        example: '2026-05-31T08:43:21.000Z'
        '400':
          description: Validation error (invalid `before` format or `limit` out of range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Insufficient role. Requires ADMIN, MANAGER, or VIEWER.
            CUSTOMER and unauthenticated callers are rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

