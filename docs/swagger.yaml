  /api/shipments/export:
    get:
      summary: Export shipments as CSV or JSON
      description: |
        Downloads filtered shipments as a CSV or JSON attachment.
        Requires JWT and ADMIN or MANAGER role. Result set capped at 10,000 records.
      tags:
        - Shipments
      security:
        - bearerAuth: []
      x-required-role: [ADMIN, MANAGER]
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: json
          description: Output format
        - in: query
          name: status
          schema:
            type: string
          description: Filter by shipment status
        - in: query
          name: origin
          schema:
            type: string
          description: Filter by origin (partial match)
        - in: query
          name: destination
          schema:
            type: string
          description: Filter by destination (partial match)
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
          description: Include shipments created at or after this timestamp
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
          description: Include shipments created at or before this timestamp
      responses:
        '200':
          description: Shipments exported successfully
          content:
            text/csv:
              schema:
                type: string
                description: CSV file attachment
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
        '400':
          description: Validation error or export too large (>10,000 records)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/password:
    patch:
      summary: Change authenticated user's password
      description: |
        Verifies `currentPassword` against the stored hash. If correct, hashes
        `newPassword` and updates the user. The current JWT is blocklisted to
        force re-login with the new credentials.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  description: The user's current plaintext password
                newPassword:
                  type: string
                  minLength: 8
                  description: New password (minimum 8 characters)
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password changed successfully
                  data:
                    type: string
                    nullable: true
                    example: null
        '400':
          description: Validation error (e.g. newPassword too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid token or incorrect currentPassword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/shipments:
    get:
      summary: Get paginated shipments with offset-based pagination
      description: Returns a paginated list of shipments. Uses offset-based pagination with page and limit parameters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: >
            Filter by status. Single value or comma-separated list
            (e.g. CREATED,IN_TRANSIT).
          example: CREATED,IN_TRANSIT
        - in: query
          name: priority
          schema:
            type: string
          description: >
            Filter by priority. Single value or comma-separated list
            (e.g. URGENT,STANDARD).
          example: URGENT,STANDARD
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (max 100)
        - in: query
          name: origin
          schema:
            type: string
          description: Filter by origin location (case-insensitive partial match)
        - in: query
          name: destination
          schema:
            type: string
          description: Filter by destination location (case-insensitive partial match)
        - in: query
          name: trackingNumber
          schema:
            type: string
          description: Filter by tracking number (case-insensitive partial match)
        - in: query
          name: q
          schema:
            type: string
          description: >
            Full-text search across trackingNumber, origin, and destination
            (MongoDB text index).
          example: NVN-123
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Include shipments created at or after this timestamp
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: Include shipments created at or before this timestamp
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, priority, expectedDelivery]
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        '200':
          description: Paginated shipments retrieved successfully
          headers:
            X-Request-ID:
              description: Unique request identifier for tracking and debugging
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Shipments retrieved'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      limit:
                        type: integer
                        description: Items per page
                        example: 20
                      total:
                        type: integer
                        description: Total number of shipments matching the query
                        example: 150
        '400':
          description: Invalid query parameters (e.g., page < 1, limit > 100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a shipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
  /api/shipments/{id}:
    get:
      summary: Get a single shipment by ID
      description: |
        Returns a single shipment wrapped in the standard API envelope
        `{ success, message, data }`. Requires JWT and one of
        SUPER_ADMIN / ADMIN / MANAGER / VIEWER. Non–super-admin callers are
        limited to shipments in their organization.
      security:
        - bearerAuth: []
      x-required-role: [SUPER_ADMIN, ADMIN, MANAGER, VIEWER]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
          description: Shipment ObjectId.
      responses:
        '200':
          description: Shipment retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Shipment'
        '400':
          description: Invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role or organization access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found (`ERR_SHIPMENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update off-chain metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offChainMetadata:
                  type: object
      responses:
        '200':
          description: Shipment updated
    delete:
      summary: Delete a shipment
      description: Soft-delete a shipment. Requires ADMIN or MANAGER role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/shipments/{id}/timeline:
    get:
      tags:
        - Shipments
      summary: Get unified shipment activity timeline
      description: |
        Returns a cursor-paginated, chronologically sorted activity timeline for a shipment.
        Events are aggregated from milestones, delivery proof, anchored telemetry, and anomalies.

        Query contract mirrors `ShipmentTimelineQuerySchema`:
        - `cursor` (optional opaque string from a previous `meta.nextCursor`)
        - `limit` (1–100, default 20)

        Response envelope: `{ success, message, data: ShipmentTimelineEvent[], meta: { nextCursor, hasMore } }`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Shipment ObjectId
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous page (`timestamp|suffix`)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of timeline events to return
      responses:
        '200':
          description: Chronological shipment events
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Shipment timeline retrieved
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShipmentTimelineEvent'
                  meta:
                    type: object
                    required: [nextCursor, hasMore]
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                        description: Cursor for the next page, or null when hasMore is false
                      hasMore:
                        type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/shipments/{id}/proof:
